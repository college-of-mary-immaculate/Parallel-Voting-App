global
    daemon
    maxconn 4096
    log stdout format raw local0

defaults
    mode http
    timeout connect 5000ms
    timeout client 50000ms
    timeout server 50000ms
    timeout http-request 10s
    timeout http-keep-alive 10s
    option httplog
    option dontlognull
    option forwardfor
    option http-server-close
    stats enable
    stats uri /stats
    stats realm HAProxy\ Statistics
    stats auth admin:admin123

# Frontend for main application
frontend voting_frontend
    bind *:80
    default_backend voting_servers
    option http-server-close
    option forwardfor except 127.0.0.0/8
    timeout client 1m
    capture request header Host len 32
    capture request header User-Agent len 64

# Frontend for API endpoints
frontend api_frontend
    bind *:5000
    default_backend api_servers
    option http-server-close
    option forwardfor except 127.0.0.0/8
    timeout client 1m
    acl is_api path_beg /api
    use_backend api_servers if is_api

# Backend for application servers (WebSocket support)
backend voting_servers
    balance roundrobin
    option httpchk GET /health
    server app1 app_server1:3000 check weight 1
    server app2 app_server2:3001 check weight 1
    server app3 app_server3:3002 check weight 1
    timeout server 1m
    timeout connect 5s
    retries 3

# Backend for API servers
backend api_servers
    balance roundrobin
    option httpchk GET /api/health
    server api1 app_server1:5000 check weight 1
    server api2 app_server2:5001 check weight 1
    server api3 app_server3:5002 check weight 1
    timeout server 1m
    timeout connect 5s
    retries 3

# Statistics dashboard
listen stats
    bind *:8404
    stats enable
    stats uri /
    stats refresh 30s
    stats admin if TRUE
    stats show-legends
    stats show-desc "Parallel Voting App Load Balancer Statistics"

# WebSocket upgrade support
frontend websocket_frontend
    bind *:80
    acl is_websocket hdr(upgrade) -i websocket
    use_backend websocket_servers if is_websocket

backend websocket_servers
    balance roundrobin
    server ws1 app_server1:3000 check
    server ws2 app_server2:3001 check
    server ws3 app_server3:3002 check
